<header
  class="fixed top-0 left-0 w-full z-50 transition-all duration-300 backdrop-blur-md border-b"
  [ngClass]="{
    'bg-[#070b14]/90 border-slate-800/80 shadow-lg shadow-black/20': isScrolled,
    'bg-[#070b14]/75 border-slate-800/40': !isScrolled
  }"
>
  <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
    <!-- Logo Brand -->
    <a href="#home" class="flex items-center gap-2.5 group">
      <!-- Icon emblem -->
      <div class="w-8 h-8 rounded-lg bg-gradient-to-tr from-blue-600 to-indigo-500 flex items-center justify-center shadow-md shadow-blue-500/30 group-hover:scale-105 transition-transform duration-200">
        <svg class="w-4 h-4 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z" />
        </svg>
      </div>
      <div class="flex flex-col">
        <span class="text-lg font-bold tracking-tight text-white flex items-center gap-1 leading-none">
          SOLVANE
        </span>
        <span class="text-[9px] uppercase tracking-[0.2em] text-slate-400 font-semibold mt-1">
          Technologies
        </span>
      </div>
    </a>

    <!-- Desktop Navigation Links -->
    <nav class="hidden md:flex items-center gap-7">
      <ng-container *ngFor="let item of navItems">
        <a
          [href]="item.href"
          class="text-xs font-medium text-slate-300 hover:text-white transition-colors duration-200 flex items-center gap-1 group"
        >
          <span>{{ item.label }}</span>
          <svg
            *ngIf="item.hasDropdown"
            class="w-3 h-3 text-slate-400 group-hover:text-white transition-transform group-hover:translate-y-0.5"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="2"
          >
            <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
          </svg>
        </a>
      </ng-container>
    </nav>

    <!-- Header Actions (CTA) -->
    <div class="hidden md:flex items-center">
      <a
        href="#contact"
        class="inline-flex items-center gap-2 bg-gradient-to-r from-blue-600 via-indigo-600 to-blue-500 hover:from-blue-500 hover:to-indigo-500 text-white text-xs font-medium px-5 py-2.5 rounded-full shadow-lg shadow-blue-600/25 transition-all duration-200 hover:shadow-blue-600/40 active:scale-95"
      >
        <span>Start a Conversation</span>
        <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M14 5l7 7m0 0l-7 7m7-7H3" />
        </svg>
      </a>
    </div>

    <!-- Mobile Hamburger Toggle -->
    <button
      (click)="toggleMobileMenu()"
      class="md:hidden text-slate-400 hover:text-white p-2 focus:outline-none"
      aria-label="Toggle Menu"
    >
      <svg *ngIf="!isMobileMenuOpen" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7" />
      </svg>
      <svg *ngIf="isMobileMenuOpen" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
      </svg>
    </button>
  </div>

  <!-- Mobile Dropdown Menu -->
  <div
    *ngIf="isMobileMenuOpen"
    class="md:hidden bg-[#070b14]/95 border-b border-slate-800 px-6 py-5 flex flex-col gap-4"
  >
    <a
      *ngFor="let item of navItems"
      [href]="item.href"
      (click)="closeMobileMenu()"
      class="text-sm font-medium text-slate-300 hover:text-white py-1 flex items-center justify-between"
    >
      <span>{{ item.label }}</span>
      <span *ngIf="item.hasDropdown" class="text-xs text-slate-500">▾</span>
    </a>
    <a
      href="#contact"
      (click)="closeMobileMenu()"
      class="mt-2 w-full text-center bg-gradient-to-r from-blue-600 to-indigo-600 text-white text-xs font-semibold py-3 rounded-full"
    >
      Start a Conversation →
    </a>
  </div>
</header>
