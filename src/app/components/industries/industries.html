<section id="industries" class="py-24 bg-white text-slate-900 overflow-hidden">
  <div class="max-w-[1400px] mx-auto px-6 grid grid-cols-1 lg:grid-cols-12 gap-12 items-center">
    
    <div class="lg:col-span-3">
      <span class="text-[10px] uppercase font-bold tracking-widest text-slate-400 block mb-3">Industries We Serve</span>
      <h2 class="text-3xl font-extrabold tracking-tight mb-4">Technology for Every Industry</h2>
      <p class="text-slate-600 text-sm leading-relaxed mb-8">
        We understand that every industry has unique challenges. That's why we build solutions that fit your business, not the other way around.
      </p>
      <a href="#" class="inline-flex bg-blue-600 hover:bg-blue-500 text-white text-xs font-semibold px-6 py-3 rounded-full transition">
        Explore All Industries →
      </a>
    </div>

    <div class="lg:col-span-9 flex gap-6 overflow-x-auto pb-4 hide-scrollbar">
      <div *ngFor="let ind of industries" class="min-w-[220px] max-w-[220px] flex-shrink-0">
        <div class="h-32 bg-slate-100 rounded-2xl mb-4 overflow-hidden relative">
          <img [src]="ind.img" [alt]="ind.title" class="w-full h-full object-cover">
          <div class="absolute -bottom-4 left-4 w-10 h-10 bg-white rounded-lg shadow flex items-center justify-center text-blue-600 border border-slate-100">
            {{ ind.icon }}
          </div>
        </div>
        <h3 class="font-bold text-sm mt-6 mb-2">{{ ind.title }}</h3>
        <p class="text-[11px] text-slate-500 leading-relaxed">{{ ind.desc }}</p>
      </div>
    </div>

  </div>
</section>
